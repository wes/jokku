name: release

# Push a tag like v0.0.2 to publish Linux binaries for install.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/wes/jokku/internal/version.Version=${GITHUB_REF_NAME} -X github.com/wes/jokku/internal/version.Commit=${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o dist/jokku-linux-$arch ./cmd/jokku
          done
          cd dist && sha256sum jokku-linux-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  # Installs the just-published release with the public one-liner.
  verify-install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Install with the README command
        run: curl -fsSL "https://raw.githubusercontent.com/wes/jokku/${GITHUB_REF_NAME}/install.sh" | sudo JOKKU_VERSION="$GITHUB_REF_NAME" sh
      - name: Check
        run: |
          systemctl is-active jokku
          jokku version | grep -F "jokku version ${GITHUB_REF_NAME} "
          sudo jokku apps:create smoke-test
          sudo jokku apps:list | grep -x smoke-test

  # Installs the previous release with its own installer, then updates to this
  # one with the public update command, the way existing servers will.
  verify-update:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the previous release
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n 1)
          if [ -z "$prev" ]; then echo "No previous release; nothing to update from."; exit 0; fi
          echo "PREV=$prev" >> "$GITHUB_ENV"
          curl -fsSL "https://raw.githubusercontent.com/wes/jokku/$prev/install.sh" | sudo JOKKU_VERSION="$prev" sh
          sudo jokku apps:create survives-update
      - name: Update with the README command
        if: env.PREV != ''
        run: curl -fsSL "https://raw.githubusercontent.com/wes/jokku/${GITHUB_REF_NAME}/update.sh" | sudo JOKKU_VERSION="$GITHUB_REF_NAME" sh
      - name: Check
        if: env.PREV != ''
        run: |
          systemctl is-active jokku
          sudo jokku version | grep -F "server version ${GITHUB_REF_NAME} "
          sudo jokku apps:list | grep -x survives-update
