name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Installs, updates and rolls back on a fresh runner (systemd, sshd), driving
  # jokku over real ssh.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build old, new and broken releases
        run: |
          for v in old new; do
            mkdir -p dist/$v
            CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/wes/jokku/internal/version.Version=ci-$v" -o dist/$v/jokku-linux-amd64 ./cmd/jokku
          done
          mkdir -p dist/broken
          printf '#!/bin/sh\necho "this release is broken" >&2\nexit 1\n' > dist/broken/jokku-linux-amd64
          chmod +x dist/broken/jokku-linux-amd64
          for v in old new broken; do (cd dist/$v && sha256sum jokku-linux-amd64 > checksums.txt); done
      - name: Build an S3 server for the backup tests
        run: GOBIN=$PWD/tools go install github.com/versity/versitygw/cmd/versitygw@v1.8.0
      - run: VERSITYGW=$PWD/tools/versitygw bash test/server-e2e.sh dist

  # A two-node cluster: the runner is the control node, a QEMU VM joins as a
  # worker over WireGuard.
  cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/wes/jokku/internal/version.Version=ci-${GITHUB_SHA::7}" -o dist/jokku-linux-amd64 ./cmd/jokku
          cd dist && sha256sum jokku-linux-amd64 > checksums.txt
      - name: Tools for the worker VM
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils wireguard-tools >/dev/null
      - run: bash test/cluster-e2e.sh dist

  # An edge in front of a home cluster: the runner is the home control node,
  # dropping every connection the edge opens to it as NAT would, and a QEMU
  # VM is the public edge.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/wes/jokku/internal/version.Version=ci-${GITHUB_SHA::7}" -o dist/jokku-linux-amd64 ./cmd/jokku
          cd dist && sha256sum jokku-linux-amd64 > checksums.txt
      - name: Tools for the edge VM
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils wireguard-tools >/dev/null
      - run: bash test/edge-e2e.sh dist
